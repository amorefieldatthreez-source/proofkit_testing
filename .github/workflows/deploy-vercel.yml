name: Deploy to Vercel

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0

      - name: Install and build webviewer
        working-directory: ./webviewer
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG: ${{ secrets.VERCEL_ORG }}
        run: |
          # Deploy the built webviewer directory to Vercel using the provided token.
          # Requires repository secrets:
          # - VERCEL_TOKEN (required): a Vercel Personal Token
          # - VERCEL_ORG (optional): your Vercel team/org slug (used as --scope)
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Missing VERCEL_TOKEN secret. Add it in GitHub -> Settings -> Secrets and variables -> Actions." >&2
            exit 1
          fi

          ARGS=(--prod --confirm --name proofkit_testing --cwd webviewer --token "$VERCEL_TOKEN")
          if [ -n "$VERCEL_ORG" ]; then
            ARGS+=(--scope "$VERCEL_ORG")
          fi

          npx vercel "${ARGS[@]}"
